; Waveshare ESP32-S3 dev board (N16R8) + EBYTE E22-900M30S
[env:diy_s3_e22]
extends = esp32s3_base
board = esp32-s3-devkitc-1

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
; Same PSRAM description as the seeed-xiao-s3 board, so both S3 nodes reuse one set of compiled framework libs
board_build.psram_type = opi
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

build_flags =
    ${esp32s3_base.build_flags}
    -I variants/diy_s3_e22
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Range test and the reply bot are excluded from all builds by the root platformio.ini
build_unflags =
    ${esp32_common.build_unflags}
    -DMESHTASTIC_EXCLUDE_RANGETEST=1
    -DMESHTASTIC_EXCLUDE_REPLYBOT=1
