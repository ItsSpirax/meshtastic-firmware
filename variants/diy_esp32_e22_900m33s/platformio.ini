; DOIT ESP32 DevKit V1 + EBYTE E22-900M33S
[env:diy_esp32_e22_900m33s]
extends = esp32_base
board = esp32doit-devkit-v1

build_flags =
    ${esp32_base.build_flags}
    -I variants/diy_esp32_e22_900m33s

; Range test and the reply bot are excluded from all builds by the root platformio.ini
build_unflags =
    ${esp32_common.build_unflags}
    -DMESHTASTIC_EXCLUDE_RANGETEST=1
    -DMESHTASTIC_EXCLUDE_REPLYBOT=1
