; Seeed XIAO ESP32-S3 + Wio-SX1262 kit; stock seeed-xiao-s3 variant with range test and the reply bot compiled in
[env:diy_xiao_s3_wio]
extends = env:seeed-xiao-s3
; The stock 921600 baud upload hangs on this board's USB-Serial/JTAG port
upload_speed = 460800

; Range test and the reply bot are excluded from all builds by the root platformio.ini
build_unflags =
    ${esp32_common.build_unflags}
    -DMESHTASTIC_EXCLUDE_RANGETEST=1
    -DMESHTASTIC_EXCLUDE_REPLYBOT=1
